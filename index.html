function projectLatLon(lat, lon) {
  const x = PROJ.xScale * lon + PROJ.xOffset;
  const merc = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));

  return [x, y];
}

const EVIDENCE_ORDER = { alta: 3, media: 2, baja: 1, "sin-evaluacion": 0 };

function EvidenceBadge({ evidencia }) {
  if (!evidencia || !evidencia.nivel) return null;
  const info = EVIDENCE_LEVELS[evidencia.nivel];
  if (!info) return null;
  return (
    <span
      className="atlas-evidence-badge"
      style={{ borderColor: info.color, color: info.color }}
      title={evidencia.nota || info.desc}
    >
      {info.label}
    </span>
  );
}

function App() {
  const policies = POLICIES;
  const [search, setSearch] = useState("");
  const [activeCategory, setActiveCategory] = useState(null);
  const [viewMode, setViewMode] = useState("cards");
  const [selectedId, setSelectedId] = useState(null);
  const [activeEvidence, setActiveEvidence] = useState(
    () => new Set(Object.keys(EVIDENCE_LEVELS))
  );
  const [evidenceSort, setEvidenceSort] = useState("none"); // "none" | "desc" | "asc"
  const [box, setBox] = useState({ x: 0, y: 0, w: MAP_W, h: MAP_H });
  const [dragging, setDragging] = useState(null);
  const mapSvgRef = React.useRef(null);

  function toggleEvidence(level) {
    setActiveEvidence((prev) => {
      const isOnlyThisOne = prev.size === 1 && prev.has(level);
      if (isOnlyThisOne) return new Set(Object.keys(EVIDENCE_LEVELS));
      return new Set([level]);
    });
  }

  function cycleSort() {
    setEvidenceSort((prev) =>
      prev === "none" ? "desc" : prev === "desc" ? "asc" : "none"
    );
  }

  const counts = useMemo(() => {
    const c = {};
    for (const cat of CATEGORIES) c[cat.id] = 0;
    for (const p of policies) c[p.categoria] = (c[p.categoria] || 0) + 1;
    return c;
  }, [policies]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    let list = policies.filter((p) => {
      if (activeCategory && p.categoria !== activeCategory) return false;
      if (activeEvidence.size < Object.keys(EVIDENCE_LEVELS).length) {
        if (!activeEvidence.has(p.evidencia?.nivel)) return false;
      }
      if (!q) return true;
      const haystack = `${p.titulo} ${p.ciudad} ${p.pais} ${p.resumen}`.toLowerCase();
      return haystack.includes(q);
    });
    if (evidenceSort !== "none") {
      list = [...list].sort((a, b) => {
        const ra = EVIDENCE_ORDER[a.evidencia?.nivel] ?? -1;
        const rb = EVIDENCE_ORDER[b.evidencia?.nivel] ?? -1;
        return evidenceSort === "desc" ? rb - ra : ra - rb;
      });
    }
    return list;
  }, [policies, search, activeCategory, activeEvidence, evidenceSort]);

  const pins = useMemo(() => {
    const byCity = {};
    for (const p of filtered) {
      const coords = CITY_COORDS[p.ciudad];
      if (!coords) continue;
      if (!byCity[p.ciudad]) byCity[p.ciudad] = [];
      byCity[p.ciudad].push(p);
    }
    const result = [];
    for (const city of Object.keys(byCity)) {
      const group = byCity[city];
      const [baseX, baseY] = projectLatLon(...CITY_COORDS[city]);
      group.forEach((p, i) => {
        let x = baseX;
        let y = baseY;
        if (group.length > 1) {
          const angle = (i / group.length) * Math.PI * 2;
          x += Math.cos(angle) * 6;
          y += Math.sin(angle) * 6;
        }
        result.push({ policy: p, x, y });
      });
    }
    return result;
  }, [filtered]);

  const unmapped = useMemo(
    () => filtered.filter((p) => !CITY_COORDS[p.ciudad]),

  const selectedPolicy = policies.find((p) => p.id === selectedId) || null;

  function clientToSvgPoint(clientX, clientY) {
    const svg = mapSvgRef.current;
    if (!svg) return { x: 0, y: 0 };
    const rect = svg.getBoundingClientRect();
    const relX = (clientX - rect.left) / rect.width;
    const relY = (clientY - rect.top) / rect.height;
    return { x: box.x + relX * box.w, y: box.y + relY * box.h };
  }

  function zoomAt(factor, clientX, clientY) {
    setBox((prev) => {
      const anchor =
        clientX != null ? clientToSvgPoint(clientX, clientY) : { x: prev.x + prev.w / 2, y: prev.y + prev.h / 2 };
      let newW = prev.w * factor;
      let newH = prev.h * factor;
      const maxW = MAP_W;
      const maxH = MAP_H;
      const minW = MAP_W / 16;
      const minH = MAP_H / 16;
      newW = Math.min(maxW, Math.max(minW, newW));
      newH = Math.min(maxH, Math.max(minH, newH));
      const ratioX = (anchor.x - prev.x) / prev.w;
      const ratioY = (anchor.y - prev.y) / prev.h;
      let newX = anchor.x - ratioX * newW;
      let newY = anchor.y - ratioY * newH;
      newX = Math.min(MAP_W - newW, Math.max(0, newX));
      newY = Math.min(MAP_H - newH, Math.max(0, newY));
      return { x: newX, y: newY, w: newW, h: newH };
    });
  }

  function handleWheel(e) {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    zoomAt(factor, e.clientX, e.clientY);
  }

  function handlePointerDown(e) {
    setDragging({ startClientX: e.clientX, startClientY: e.clientY, startBox: box });
  }
  function handlePointerMove(e) {
    if (!dragging) return;
    const svg = mapSvgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const dxClient = e.clientX - dragging.startClientX;
    const dyClient = e.clientY - dragging.startClientY;
    const dx = (dxClient / rect.width) * dragging.startBox.w;
    const dy = (dyClient / rect.height) * dragging.startBox.h;
    let newX = dragging.startBox.x - dx;
    let newY = dragging.startBox.y - dy;
    newX = Math.min(MAP_W - dragging.startBox.w, Math.max(0, newX));
    newY = Math.min(MAP_H - dragging.startBox.h, Math.max(0, newY));
    setBox({ x: newX, y: newY, w: dragging.startBox.w, h: dragging.startBox.h });
  }
  function handlePointerUp() {
    setDragging(null);
  }

  function fitBoxToContainer(fullWorld) {
    const svg = mapSvgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const containerAspect = rect.width / rect.height;
    setBox((prev) => {
      const base = fullWorld ? { x: 0, y: 0, w: MAP_W, h: MAP_H } : prev;
      const centerX = base.x + base.w / 2;
      const centerY = base.y + base.h / 2;
      let newW = fullWorld ? MAP_W : base.w;
      let newH = newW / containerAspect;
      if (newH > MAP_H) {
        newH = MAP_H;
        newW = newH * containerAspect;
      }
      newW = Math.min(newW, MAP_W);
      let newX = centerX - newW / 2;
      let newY = centerY - newH / 2;
      newX = Math.min(MAP_W - newW, Math.max(0, newX));
      newY = Math.min(MAP_H - newH, Math.max(0, newY));
      return { x: newX, y: newY, w: newW, h: newH };
    });
  }

    if (viewMode !== "map") return;
    fitBoxToContainer(true);
    function handleResize() {
      fitBoxToContainer(false);
    }

        }
        .atlas-card-body { padding: 16px 18px 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .atlas-card-place {
          font-family: 'Source Serif 4', serif;
          font-weight: 600;
          font-size: 15px;
          margin: 0;
        }
        .atlas-card-title {
          font-size: 14px;
          font-weight: 500;
          margin: 0;
          color: var(--ink);
        }
        .atlas-card-summary {
          font-size: 13.5px;
          line-height: 1.5;
          color: #34423A;
          margin: 0;
        }
        .atlas-card-results {
          font-size: 13px;
          line-height: 1.5;

        }
        .atlas-card-footer {
          margin-top: auto;
          padding-top: 10px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 12px;
          color: var(--muted);
          gap: 8px;
        }
        .atlas-card-footer a { color: var(--ink); text-decoration: underline; }
        .atlas-badge {
          font-size: 11px;
          padding: 2px 7px;
          border-radius: 10px;
          border: 1px solid var(--line);
          white-space: nowrap;
        }
        .atlas-badge.pending { color: #8C6D2F; border-color: #C9AE7A; background: #FBF4E6; }
        .atlas-badge.verified { color: #2F6B62; border-color: #9CC0B7; background: #EAF2EE; }
        .atlas-evidence-row { margin-top: 2px; }
        .atlas-evidence-badge {

        .atlas-delete {

          border: none;
          color: var(--muted);
          cursor: pointer;
          font-size: 12px;

        .atlas-empty {

          text-align: center;
          color: var(--muted);
          font-size: 14px;
        }

        .atlas-modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(27,42,61,0.35);

          padding: 40px 16px;
          overflow-y: auto;
          z-index: 50;

        .atlas-modal {

          font-family: 'Source Serif 4', serif;

          margin: 0 0 4px;
        }
        .atlas-modal p.hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
        .atlas-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        .atlas-field label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
        .atlas-field input, .atlas-field textarea, .atlas-field select {
          border: 1px solid var(--line);
          border-radius: 3px;

          font-family: inherit;

          background: #fff;
          color: var(--ink);
        }
        .atlas-field textarea { resize: vertical; min-height: 54px; }
        .atlas-field-row { display: flex; gap: 10px; }
        .atlas-field-row .atlas-field { flex: 1; }
        .atlas-modal-actions {
          display: flex;
          justify-content: flex-end;
          gap: 10px;
          margin-top: 16px;
        }
        .atlas-btn-secondary {

        .atlas-save-warning {
          font-size: 12px;
          color: #A64B3D;

        .atlas-access-error {
          font-size: 12px;
          color: #A64B3D;
          margin: 4px 0 0;
        }
        .atlas-footer {
          text-align: center;
          font-size: 12px;
          color: var(--muted);
          padding: 14px 20px 20px;
          border-top: 1px solid var(--line);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
        .atlas-footer p { margin: 0; }
        .atlas-footer-links {
          display: flex;
          gap: 8px;
        }
        .atlas-footer-links a {
          width: 30px;
          height: 30px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid var(--line);
          border-radius: 4px;
          color: var(--ink);
          background: var(--paper-card);
        }
        .atlas-footer-links a:hover {
          background: var(--ink);
          color: #F4F6F1;
          border-color: var(--ink);
        }

        @media (max-width: 760px) {
          .atlas-body { flex-direction: column; }
          .atlas-sidebar {
            width: 100%;
            display: flex;
            overflow-x: auto;
            padding: 12px 14px;
            gap: 4px;
            border-right: none;
            border-bottom: 1px solid var(--line);
          }
          .atlas-sidebar-item {
            border-left: none;
            border-bottom: 3px solid transparent;
            padding: 6px 10px;
            white-space: nowrap;
          }
          .atlas-sidebar-item.active { border-bottom-color: var(--gold); background: transparent; }
          .atlas-main { padding: 18px 16px 40px; }
          .atlas-header { padding: 20px 16px 16px; }
        }
      `}</style>

      <header className={"atlas-header" + (viewMode === "map" ? " atlas-header-compact" : "")}>
        <div className="atlas-title-block">
          {viewMode === "map" ? (
            <h1 className="atlas-h1-compact">Atlas de Políticas Municipales — Mapa mundial</h1>
          ) : (
            <>
              <h1>Atlas de Políticas Municipales</h1>
              <p>
                Políticas públicas locales de otras ciudades del mundo, ordenadas por temática y
                con un nivel de evidencia honesto para cada resultado citado — pensado para saber
                cuáles conviene tomar como modelo y cuáles conviene mirar con más cautela.
              </p>
            </>
          )}
          <p className="atlas-legend">
            <span>Evidencia (tocá para filtrar):</span>
            {Object.entries(EVIDENCE_LEVELS).map(([key, info]) => {
              const isActive = activeEvidence.has(key);
              return (
                <button
                  key={key}
                  type="button"
                  className={
                    "atlas-evidence-badge atlas-legend-item" +
                    (isActive ? "" : " atlas-legend-item-off")
                  }
                  style={{
                    borderColor: info.color,
                    color: isActive ? info.color : "#B9B9B2",
                    background: isActive ? "#fff" : "#EEEEE6",
                  }}
                  title={info.desc}
                  onClick={() => toggleEvidence(key)}
                >
                  {info.label}
                </button>
              );
            })}
            <button type="button" className="atlas-sort-btn" onClick={cycleSort}>
              <ArrowUpDown size={12} />
              {evidenceSort === "none"
                ? "Ordenar por evidencia"
                : evidenceSort === "desc"
                ? "Evidencia: alta primero"
                : "Evidencia: baja primero"}
            </button>
          </p>
        </div>
        <div className="atlas-controls">
          <input
            className="atlas-search"
            type="text"
            placeholder="Buscar por ciudad, país o palabra clave…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
          <button
            className="atlas-toggle-btn"
            onClick={() => setViewMode("cards")}
            aria-pressed={viewMode === "cards"}
            title="Ver tarjetas"
          >
            <LayoutGrid size={16} />
            Tarjetas
          </button>
          <button
            className="atlas-toggle-btn"
            onClick={() => setViewMode("map")}
            aria-pressed={viewMode === "map"}
            title="Ver mapa mundial"
          >
            <MapIcon size={16} />
            Mapa
          </button>
        </div>
      </header>

      <div className="atlas-body">
        <nav className="atlas-sidebar">
          <div
            className={"atlas-sidebar-item" + (activeCategory === null ? " active" : "")}
            onClick={() => setActiveCategory(null)}
          >
            <LayoutList size={15} className="cat-icon" style={{ color: "var(--ink)" }} />
            <span className="name">Todas las temáticas</span>
            <span className="count">{policies.length}</span>
          </div>
          {CATEGORIES.map((cat) => {
            const Icon = cat.icon;
            return (
              <div
                key={cat.id}
                className={"atlas-sidebar-item" + (activeCategory === cat.id ? " active" : "")}
                onClick={() => setActiveCategory(cat.id)}
              >
                <Icon size={15} className="cat-icon" style={{ color: cat.color }} />
                <span className="name">{cat.label}</span>
                <span className="count">{counts[cat.id] || 0}</span>
              </div>
            );
          })}
        </nav>

        <main className={"atlas-main" + (viewMode === "map" ? " atlas-main-map" : "")}>
          {filtered.length === 0 ? (
            <div className="atlas-empty">
              No hay políticas que coincidan con esa búsqueda. Probá con otro término o
              cambiá los filtros.
            </div>
          ) : viewMode === "map" ? (
            <div className="atlas-map-wrap">
              <div className="atlas-map-zoom-controls">
                <button type="button" onClick={() => zoomAt(1 / 1.4)} title="Acercar">
                  <Plus size={16} />
                </button>
                <button type="button" onClick={() => zoomAt(1.4)} title="Alejar">
                  <Minus size={16} />
                </button>
                <button type="button" onClick={resetView} title="Reiniciar vista">
                  <RotateCcw size={16} />
                </button>
              </div>
              <svg
                ref={mapSvgRef}
                className="atlas-map-svg"
                viewBox={`${box.x} ${box.y} ${box.w} ${box.h}`}
                onClick={() => setSelectedId(null)}
                onWheel={handleWheel}
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
                style={{ cursor: dragging ? "grabbing" : "grab" }}
              >
                <rect x={0} y={0} width={MAP_W} height={MAP_H} fill="#E4E9DE" />
                <g
                  className="atlas-world-paths"
                  dangerouslySetInnerHTML={{ __html: WORLD_MAP_PATHS }}
                />
                {pins.map(({ policy: p, x, y }) => {
                  const cat = catById[p.categoria] || CATEGORIES[0];
                  const isSelected = p.id === selectedId;
                  const r = (isSelected ? 8 : 5.5) * Math.min(1.6, Math.max(0.5, box.w / MAP_W));
                  return (
                    <circle
                      key={p.id}
                      className="atlas-map-pin"
                      cx={x}
                      cy={y}
                      r={r}
                      fill={cat.color}
                      onClick={(e) => {
                        e.stopPropagation();
                        setSelectedId(p.id);
                      }}
                    >
                      <title>
                        {p.ciudad}
                        {p.pais ? `, ${p.pais}` : ""} — {p.titulo}
                      </title>
                    </circle>
                  );
                })}
              </svg>
              <p className="atlas-map-caption">
                Mapa vectorial (proyección simplificada). Rueda del mouse o pellizco para zoom,
                arrastrar para mover, tocar un punto para ver el detalle.
              </p>
              {unmapped.length > 0 && (
                <p className="atlas-map-unmapped">
                  Sin coordenadas cargadas todavía: {unmapped.map((p) => p.ciudad).join(", ")}.
                </p>
              )}
              {selectedPolicy && (
                <div className="atlas-modal-overlay" onClick={() => setSelectedId(null)}>
                  <article
                    className="atlas-modal atlas-detail-card"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <button
                      className="atlas-detail-close"
                      onClick={() => setSelectedId(null)}
                    >
                      cerrar
                    </button>
                    {(() => {
                      const cat = catById[selectedPolicy.categoria] || CATEGORIES[0];
                      const CatIcon = cat.icon;
                      return (
                        <div className="atlas-card-cat" style={{ color: cat.color }}>
                          <CatIcon size={13} />
                          <span>{cat.label}</span>
                        </div>
                      );
                    })()}
                    <p className="atlas-card-place">
                      {selectedPolicy.ciudad}
                      {selectedPolicy.pais ? `, ${selectedPolicy.pais}` : ""}
                    </p>
                    <p className="atlas-card-title">{selectedPolicy.titulo}</p>
                    <p className="atlas-card-summary">{selectedPolicy.resumen}</p>
                    {selectedPolicy.resultados && (
                      <p className="atlas-card-results">{selectedPolicy.resultados}</p>
                    )}
                    <div className="atlas-evidence-row">
                      <EvidenceBadge evidencia={selectedPolicy.evidencia} />
                    </div>
                    {selectedPolicy.evidencia?.nota && (
                      <p className="atlas-evidence-note">{selectedPolicy.evidencia.nota}</p>
                    )}
                    <div className="atlas-card-footer">
                      <span>
                        {selectedPolicy.anio ? `${selectedPolicy.anio} · ` : ""}
                        {selectedPolicy.fuenteUrl ? (
                          <a href={selectedPolicy.fuenteUrl} target="_blank" rel="noreferrer">
                            {selectedPolicy.fuenteNombre || "fuente"}
                          </a>
                        ) : (
                          <span className="atlas-badge pending">fuente pendiente</span>
                        )}
                      </span>
                    </div>
                  </article>
                </div>
              )}
            </div>
          ) : (
            <div className="atlas-grid">
              {filtered.map((p) => {
                const cat = catById[p.categoria] || CATEGORIES[0];
                const CatIcon = cat.icon;
                return (
                  <article className="atlas-card" key={p.id}>
                    <div className="atlas-card-bar" style={{ background: cat.color }} />
                    <div className="atlas-card-body">
                      <div className="atlas-card-cat" style={{ color: cat.color }}>
                        <CatIcon size={13} />
                        <span>{cat.label}</span>
                      </div>
                      <p className="atlas-card-place">
                        {p.ciudad}{p.pais ? `, ${p.pais}` : ""}
                      </p>
                      <p className="atlas-card-title">{p.titulo}</p>
                      <p className="atlas-card-summary">{p.resumen}</p>
                      {p.resultados && (
                        <p className="atlas-card-results">{p.resultados}</p>
                      )}
                      <div className="atlas-evidence-row">
                        <EvidenceBadge evidencia={p.evidencia} />
                      </div>
                      {p.evidencia?.nota && (
                        <p className="atlas-evidence-note">{p.evidencia.nota}</p>
                      )}
                      <div className="atlas-card-footer">
                        <span>
                          {p.anio ? `${p.anio} · ` : ""}
                          {p.fuenteUrl ? (
                            <a href={p.fuenteUrl} target="_blank" rel="noreferrer">
                              {p.fuenteNombre || "fuente"}
                            </a>
                          ) : (
                            <span className="atlas-badge pending">fuente pendiente</span>
                          )}
                        </span>
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>
          )}
        </main>
      </div>


      <footer className="atlas-footer">
        <p>Plataforma creada por Gonzalo Sagarraga · San Francisco, Córdoba, Argentina. 2026 ⚡</p>
        <div className="atlas-footer-links">
          <a
            href="https://www.linkedin.com/in/gsagarraga/"
            target="_blank"
            rel="noreferrer"
            aria-label="LinkedIn"
            title="LinkedIn"
          >
            <Linkedin size={16} />
          </a>
          <a
            href="https://www.instagram.com/gsagarraga"
            target="_blank"
            rel="noreferrer"
            aria-label="Instagram"
            title="Instagram"
          >
            <Instagram size={16} />
          </a>
          <a href="mailto:gsagarraga@gmail.com" aria-label="Email" title="Email">
            <Mail size={16} />
          </a>
        </div>
      </footer>
    </div>
  );
}

      createRoot(document.getElementById("root")).render(<App />);
    </script>
